<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro de Asistencia · INLOTRANS PEPSICO MP</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div>
        <h1>Registro de Asistencia por Turno</h1>
        <p>INLOTRANS · PEPSICO MP</p>
      </div>
      <a href="admin.html">Panel admin →</a>
    </div>
  </header>

  <main class="wrap">
    <div id="msg" class="alert hidden"></div>

    <form id="form" novalidate>
      <section class="card">
        <h2>1. Datos del turno</h2>
        <div class="grid">
          <div>
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required />
          </div>
          <div>
            <label for="responsable">Quién registra (supervisor / líder)</label>
            <input type="text" id="responsable" placeholder="Nombre completo" required />
          </div>
        </div>

        <label style="margin-top:16px">Turno</label>
        <div class="turnos" role="radiogroup">
          <input type="radio" name="turno" id="t1" value="T1" required />
          <label for="t1"><b>T1</b><span>Mañana</span></label>
          <input type="radio" name="turno" id="t2" value="T2" />
          <label for="t2"><b>T2</b><span>Tarde</span></label>
          <input type="radio" name="turno" id="t3" value="T3" />
          <label for="t3"><b>T3</b><span>Noche</span></label>
        </div>
      </section>

      <section class="card">
        <h2>2. Personas que asistieron</h2>
        <div class="persona persona-head">
          <span></span><span>Cédula *</span><span>Nombres y apellidos</span><span>Labor</span><span></span>
        </div>
        <div id="personas"></div>
        <div class="actions" style="margin-top:12px">
          <button type="button" class="btn-light" id="agregar">+ Agregar persona</button>
          <span class="contador" id="contador">0 personas</span>
        </div>
      </section>

      <section class="card">
        <h2>3. Observaciones (opcional)</h2>
        <textarea id="observaciones" placeholder="Novedades del turno, ausencias, reemplazos…"></textarea>
      </section>

      <div class="actions">
        <span></span>
        <button type="submit" class="btn-primary" id="enviar">Guardar asistencia</button>
      </div>
    </form>
  </main>

  <template id="tplPersona">
    <div class="persona">
      <span class="num"></span>
      <input type="text" class="doc" placeholder="Digite la cédula" inputmode="numeric" list="cedulas" autocomplete="off" />
      <input type="text" class="nombre" placeholder="—" readonly tabindex="-1" />
      <input type="text" class="cargo" placeholder="—" readonly tabindex="-1" />
      <button type="button" class="btn-icon quitar" title="Quitar">✕</button>
    </div>
  </template>
  <datalist id="cedulas"></datalist>

  <script src="config.js"></script>
  <script src="personal.js"></script>
  <script src="storage.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const lista = $("#personas");
    const tpl = $("#tplPersona");

    function hoy() {
      const d = new Date();
      d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
      return d.toISOString().slice(0, 10);
    }

    function renumerar() {
      const filas = lista.querySelectorAll(".persona");
      filas.forEach((f, i) => (f.querySelector(".num").textContent = i + 1));
      $("#contador").textContent = filas.length + (filas.length === 1 ? " persona" : " personas");
    }

    function agregarPersona(focus) {
      const fila = tpl.content.firstElementChild.cloneNode(true);
      fila.querySelector(".quitar").onclick = () => {
        if (lista.children.length > 1) fila.remove();
        else fila.querySelectorAll("input").forEach((i) => (i.value = ""));
        renumerar();
      };
      const doc = fila.querySelector(".doc");
      const completar = () => {
        const p = buscarPersona(doc.value);
        const vacio = !doc.value.trim();
        fila.querySelector(".nombre").value = p ? p.nombre : vacio ? "" : "No está en la lista del personal";
        fila.querySelector(".cargo").value = p ? p.cargo : "";
        fila.classList.toggle("ok", !!p);
        fila.classList.toggle("noexiste", !p && !vacio);
        return p;
      };
      doc.addEventListener("input", completar);
      // Enter en la cédula pasa a una nueva fila
      doc.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        if (!completar()) return;
        const sig = fila.nextElementSibling;
        if (sig) sig.querySelector(".doc").focus();
        else agregarPersona(true);
      });
      lista.appendChild(fila);
      renumerar();
      if (focus) doc.focus();
    }

    function mostrar(tipo, texto) {
      const m = $("#msg");
      m.className = "alert " + tipo;
      m.textContent = texto;
      m.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function reiniciar() {
      lista.innerHTML = "";
      for (let i = 0; i < 3; i++) agregarPersona(false);
      $("#observaciones").value = "";
      document.querySelectorAll('input[name="turno"]').forEach((r) => (r.checked = false));
    }

    $("#agregar").onclick = () => agregarPersona(true);

    $("#form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fecha = $("#fecha").value;
      const responsable = $("#responsable").value.trim();
      const turnoEl = document.querySelector('input[name="turno"]:checked');

      if (!fecha) return mostrar("err", "Selecciona la fecha.");
      if (!responsable) return mostrar("err", "Escribe quién registra.");
      if (!turnoEl) return mostrar("err", "Selecciona el turno (T1, T2 o T3).");

      const personas = [];
      const vistos = new Set();
      for (const f of lista.querySelectorAll(".persona")) {
        const valor = f.querySelector(".doc").value.trim();
        if (!valor) continue; // fila vacía
        const p = buscarPersona(valor);
        if (!p)
          return mostrar("err", "La cédula " + valor + " (fila " + f.querySelector(".num").textContent + ") no está en la lista del personal.");
        if (vistos.has(p.documento))
          return mostrar("err", p.nombre + " está repetido(a).");
        vistos.add(p.documento);
        personas.push(p);
      }
      if (!personas.length) return mostrar("err", "Agrega al menos una persona.");

      const registro = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        fecha,
        turno: turnoEl.value,
        responsable,
        observaciones: $("#observaciones").value.trim(),
        personas,
        creado: new Date().toISOString(),
      };

      const btn = $("#enviar");
      btn.disabled = true;
      btn.textContent = "Guardando…";
      try {
        await Store.save(registro);
        localStorage.setItem("inlotrans_responsable", responsable);
        mostrar("ok", `✔ Asistencia guardada: ${personas.length} persona(s) en ${registro.turno} del ${fecha}.`);
        reiniciar();
      } catch (err) {
        mostrar("err", "No se pudo guardar: " + err.message + ". Revisa tu conexión e intenta de nuevo.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Guardar asistencia";
      }
    });

    // Inicio
    $("#cedulas").innerHTML = PERSONAL.map((p) => `<option value="${p[0]}">${p[1]} · ${p[2]}</option>`).join("");
    $("#fecha").value = hoy();
    $("#responsable").value = localStorage.getItem("inlotrans_responsable") || "";
    reiniciar();
  </script>
</body>
</html>
